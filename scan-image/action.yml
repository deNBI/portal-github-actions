name: 'Scan Docker Image'
description: 'Scans a Docker image using Grype and fails if critical vulnerabilities or high risk are found.'
inputs:
  IMAGE:
    description: 'The Docker image to scan'
    required: true
  FAIL_ON_FINDINGS:
    description: 'Whether to fail the build when vulnerabilities are found (set to false to scan without blocking, e.g. for branch images)'
    required: false
    default: 'true'
  NOTIFY_MATRIX:
    description: 'Whether to notify Matrix on findings'
    required: false
    default: 'false'
  MATRIX_ROOM:
    description: 'Matrix room ID'
    required: false
  MATRIX_TOKEN:
    description: 'Matrix access token'
    required: false
  GITHUB_TOKEN:
    description: 'GitHub token for API access'
    required: false
outputs:
  has_findings:
    description: 'Whether vulnerabilities were found'
    value: ${{ steps.check-results.outputs.has_findings }}
  tier:
    description: 'Triage tier of the findings'
    value: ${{ steps.check-results.outputs.tier }}

runs:
  using: "composite"
  steps:
    - name: Install Grype
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh -o install_grype.sh
        chmod +x install_grype.sh
        ./install_grype.sh -b /tmp
        rm install_grype.sh

    - name: Run Grype Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.IMAGE }}
        GRYPE_DB_CACHE_DIR: /tmp/grype-db
      run: |
        /tmp/grype "$IMAGE" -o json > scan-results.json || true

    - name: Check scan results
      id: check-results
      shell: bash
      env:
        IMAGE: ${{ inputs.IMAGE }}
        FAIL_ON_FINDINGS: ${{ inputs.FAIL_ON_FINDINGS }}
      run: |
        set +e

        # Normalize FAIL_ON_FINDINGS: trim whitespace and lowercase so that
        # "True", " TRUE", etc. all mean the same thing. Only an explicit "true"
        # blocks the build; everything else (false, 0, empty, an unexpanded
        # ${{ }} expression) is treated as non-blocking. This prevents the
        # action from silently defaulting to blocking when a caller passes the
        # value with a different key case or format.
        FAIL_ON_FINDINGS_NORMALIZED=$(echo "${FAIL_ON_FINDINGS:-false}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
        if [ "$FAIL_ON_FINDINGS_NORMALIZED" != "true" ] && [ "$FAIL_ON_FINDINGS_NORMALIZED" != "false" ]; then
          echo "::warning::Unrecognized FAIL_ON_FINDINGS value '${FAIL_ON_FINDINGS:-}' - treating as 'false' (non-blocking)"
          FAIL_ON_FINDINGS_NORMALIZED=false
        fi

        if [ ! -f scan-results.json ]; then
          echo "Scan results file not found!"
          exit 1
        fi

        # Extract all matches (including suppressed ones) and store them for the
        # summary table, so nothing is left out of the triage tier / per-CVE view.
        # (The JSON from `grype -o json` contains every match; `--show-suppressed`
        # only affects the human-readable console output.)
        jq '[.matches // [] | .[]]' scan-results.json > scan-matches.json
        MATCH_COUNT=$(jq 'length' scan-matches.json)

        MAX_RISK=$(jq '[.[].vulnerability.risk // empty] | if length > 0 then (max * 10 | round / 10) else 0 end' scan-matches.json)
        CRITICAL=$(jq '[.[].vulnerability.severity] | map(select(. == "Critical")) | length' scan-matches.json)
        KEV=$(jq '[.[] | select((.vulnerability.knownExploited // []) | length > 0)] | length' scan-matches.json)

        if [ "$KEV" -gt 0 ]; then
          TIER="1 — Emergency"
        else
          TIER=$(jq -r '
            if ([.[] | select(
              ((.vulnerability.epss | if type == "array" then .[0].epss else .epss end) // 0) >= 0.5
              or
              ((.vulnerability.cvss | if type == "array" then .[0].vector else .vector end // "") | contains("AV:N") and contains("PR:N") and contains("UI:N"))
            )] | length > 0) then "2 — Urgent"
            elif ([.[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")] | length > 0) then "3 — Scheduled"
            else "4 — Backlog"
            end' scan-matches.json)
        fi

        echo "MAX_RISK=${MAX_RISK}"
        echo "CRITICAL=${CRITICAL}"
        echo "KEV=${KEV}"
        echo "TIER=${TIER}"

        HAS_FINDINGS=false
        if [[ "$TIER" == *"1"* ]] || [[ "$TIER" == *"2"* ]] || [[ "$TIER" == *"3"* ]]; then
          HAS_FINDINGS=true
        fi

        echo "Found: ${HAS_FINDINGS}"
        echo "has_findings=${HAS_FINDINGS}" >> $GITHUB_OUTPUT
        echo "critical=${CRITICAL}" >> $GITHUB_OUTPUT
        echo "kev=${KEV}" >> $GITHUB_OUTPUT
        echo "max_risk=${MAX_RISK:-0}" >> $GITHUB_OUTPUT
        echo "tier=${TIER}" >> $GITHUB_OUTPUT

        REASON=$(jq -r '
          if (any(.[]; .vulnerability.kev == true or .vulnerability.knownExploited == true)) then "KEV"
          elif (any(.[]; .vulnerability.epss | (if type == "array" then .[0].epss else . end // 0) >= 0.5)) then "EPSS"
          elif (any(.[]; .vulnerability.cvss | (if type == "array" then .[0].vector else . end // "") | contains("AV:N") and contains("PR:N") and contains("UI:N"))) then "Vector"
          else ""
          end' scan-matches.json)
        echo "reason=${REASON}" >> $GITHUB_OUTPUT

        if [[ "$TIER" == *"1"* ]] || [[ "$TIER" == *"2"* ]]; then
          if [ "$FAIL_ON_FINDINGS_NORMALIZED" = "true" ]; then
            echo "::error::Scan failed: Found vulnerabilities in Tier ${TIER}"
            exit 1
          else
            echo "::warning::Scan found vulnerabilities in Tier ${TIER}, but FAIL_ON_FINDINGS is disabled - continuing"
          fi
        fi

    - name: Scan image (Table output for human review)
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.IMAGE }}
        GRYPE_DB_CACHE_DIR: /tmp/grype-db
      run: |
        /tmp/grype "$IMAGE" --show-suppressed

    - name: Write scan summary (append, safe to run multiple times)
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.IMAGE }}
        TIER: ${{ steps.check-results.outputs.tier }}
      run: |
        set +e
        if [ ! -f scan-matches.json ]; then
          # Check step did not run (e.g. scan failed). Fall back to the raw results.
          if [ -f scan-results.json ]; then
            jq '[.matches // [] | .[]]' scan-results.json > scan-matches.json || true
          fi
        fi

        if [ -f scan-matches.json ] && [ "$(jq 'length' scan-matches.json)" -gt 0 ]; then
          MARKER="<!-- scan-summary: $IMAGE -->"
          # Only write if not already present, so the summary is not duplicated
          # when the composite action runs the same step more than once.
          if grep -qF -- "$MARKER" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "Scan summary already present in $GITHUB_STEP_SUMMARY, skipping append."
          else
            {
              echo "$MARKER"
              echo "### 🚨 Scan Summary for \`$IMAGE\`"
              if [ -n "$TIER" ]; then
                echo "**Overall Triage Tier: ${TIER}**"
              fi
              echo ""
              echo "| CVE | Tier | Component | Severity | Risk | EPSS | KEV | Patch | Reason |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |"
              jq -r 'map(. + {
                tier: (if (.vulnerability.kev == true or .vulnerability.knownExploited == true) then 1
                       else (if (((.vulnerability.epss | if type == "array" then .[0].epss else .epss end) // 0) >= 0.5 or ((.vulnerability.cvss | if type == "array" then .[0].vector else .vector end // "") | contains("AV:N") and contains("PR:N") and contains("UI:N"))) then 2
                             else (if (.vulnerability.severity == "Critical" or .vulnerability.severity == "High") then 3
                                   else 4 end) end) end)
              }) | sort_by(.tier) | .[] |
                "| \(.vulnerability.id) | \(.tier) | \(.artifact.name) | \(.vulnerability.severity) | \(.vulnerability.risk * 10 | round / 10)% | \(if ((.vulnerability.epss | if type == "array" then .[0].epss else .epss end) // 0) == 0 then "-" else ((.vulnerability.epss | if type == "array" then .[0].epss else .epss end) * 100 | round / 100) end) | \(if (.vulnerability.kev == true or .vulnerability.knownExploited == true) then "✅" else "❌" end) | \(if (.vulnerability.fix.state == "fixed") then "✅" else "❌" end) | \(if (.vulnerability.kev == true or .vulnerability.knownExploited == true) then "KEV" else (if ((.vulnerability.epss | if type == "array" then .[0].epss else .epss end) // 0) >= 0.5 then "EPSS" else (if ((.vulnerability.cvss | if type == "array" then .[0].vector else .vector end // "") | contains("AV:N") and contains("PR:N") and contains("UI:N")) then "Vector" else "" end) end) end) |"' scan-matches.json
            } >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "No matches to write to the scan summary."
        fi

    - name: Notify on findings
      if: always() && steps.check-results.outputs.has_findings == 'true' && inputs.NOTIFY_MATRIX == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        ROOM_ID: ${{ inputs.MATRIX_ROOM }}
        ACCESS_TOKEN: ${{ inputs.MATRIX_TOKEN }}
        IMAGE: ${{ inputs.IMAGE }}
        CRITICAL: ${{ steps.check-results.outputs.critical }}
        KEV: ${{ steps.check-results.outputs.kev }}
        MAX_RISK: ${{ steps.check-results.outputs.max_risk }}
        TIER: ${{ steps.check-results.outputs.tier }}
        REASON: ${{ steps.check-results.outputs.reason }}
        RUN_ID: ${{ github.run_id }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set +e

        # Get Job ID for direct link to logs
        JOB_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
          | jq -r --arg img "$IMAGE" '.jobs[] | select(.name == "build_release" or .name == "rebuild_and_scan") | .id' | head -n 1)

        if [ -n "$JOB_ID" ]; then
          URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID/job/$JOB_ID"
        else
          URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
        fi

        jq -nc \
          --arg img "$IMAGE" \
          --arg crit "$CRITICAL" \
          --arg kev "$KEV" \
          --arg risk "$MAX_RISK" \
          --arg tier "$TIER" \
          --arg reason "$REASON" \
          --arg url "$URL" \
          '{
            msgtype: "m.text",
            body: (
              "Critical OCI image scan findings\n" +
              "Tier: " + $tier + " (" + $reason + ")\n" +
              "Image: " + $img + "\n" +
              "Critical CVEs: " + $crit + "\n" +
              "Max risk: " + $risk + "%\n" +
              "KEV: " + $kev + "\n" +
              "Run: " + $url
            ),
            format: "org.matrix.custom.html",
            formatted_body: (
              "<h3>🚨 Critical OCI image scan findings</h3>" +
              "<table>" +
              "<tr><td><b>Tier:</b></td><td>" + $tier + " (" + $reason + ")</td></tr>" +
              "<tr><td><b>Image:</b></td><td>" + $img + "</td></tr>" +
              "<tr><td><b>Critical CVEs:</b></td><td>" + $crit + "</td></tr>" +
              "<tr><td><b>Max risk:</b></td><td>" + $risk + "%</td></tr>" +
              "<tr><td><b>KEV:</b></td><td>" + $kev + "</td></tr>" +
              "</table>" +
              "<br>" +
              "🔗 <a href=\"" + $url + "\">Open Scan Summary</a>"
            )
          }' | \
          curl -sS -X POST \
            "https://matrix.org/_matrix/client/r0/rooms/${ROOM_ID}/send/m.room.message" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @-
      continue-on-error: true
