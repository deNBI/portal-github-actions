name: 'Build Docker Image'
description: 'Builds a Docker image and loads it into the local Docker daemon for scanning.'
inputs:
  image:
    description: 'The full image tag to build (e.g. registry/repo:tag)'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile'
    required: true
  registry:
    description: 'The registry URL'
    required: false
    default: 'oci.bi.denbi.de'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password'
    required: true
  context:
    description: 'Build context path'
    required: false
    default: '.'
  build_args:
    description: 'Build arguments as a comma-separated string (KEY=VALUE,KEY2=VALUE2)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Login to Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and load image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: false
        tags: ${{ inputs.image }}
        load: true
        build-args: ${{ inputs.build_args }}
