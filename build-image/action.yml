name: 'Build Docker Image'
description: 'Builds a Docker image and loads it into the local Docker daemon for scanning.'
inputs:
  image:
    description: 'The full image tag to build (e.g. registry/repo:tag)'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile'
    required: true
  registry:
    description: 'The registry URL'
    required: false
    default: 'oci.bi.denbi.de'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Login to Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and load image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ${{ inputs.dockerfile }}
        push: false
        tags: ${{ inputs.image }}
        load: true
