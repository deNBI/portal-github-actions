name: Generic Release Image Workflow

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: 'The base name of the image (e.g. oci.bi.denbi.de/simplevm/simplevm-backend)'
        required: true
        type: string
      IMAGE_TAG:
        description: 'The tag for the image. If not provided, the latest git tag is used.'
        required: false
        type: string
      DOCKERFILE:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      NOTIFY_MATRIX:
        description: 'Whether to notify Matrix on findings'
        required: false
        default: false
        type: boolean
      RUNS_ON:
        description: 'Runner labels to use (JSON array)'
        required: false
        default: '["self-hosted", "production", "build"]'
        type: string

    secrets:
      MATRIX_ROOM:
        required: false
      OCI_USERNAME:
        required: true
      OCI_TOKEN:
        required: true
      CUSTOM_GITHUB_TOKEN:
        required: true
      MATRIX_ACCESS_TOKEN:
        required: false

jobs:
  build_scan_publish:
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine Image Tag
        id: determine-tag
        shell: bash
        run: |
          if [ -n "${{ inputs.IMAGE_TAG }}" ]; then
            echo "Using provided tag: ${{ inputs.IMAGE_TAG }}"
            echo "tag=${{ inputs.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
            echo "No tag provided. Using latest git tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Build and Scan Image
        uses: denbi/portal-github-actions/build-and-scan-image@260565cbd8654f905bd99b5de428179f63480808 # main
        with:
          image: ${{ inputs.IMAGE_NAME }}:${{ steps.determine-tag.outputs.tag }}
          dockerfile: ${{ inputs.DOCKERFILE }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}
          notify_matrix: ${{ inputs.NOTIFY_MATRIX }}
          matrix_room: ${{ secrets.MATRIX_ROOM }}
          matrix_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - name: Generate and Publish Image
        uses: denbi/portal-github-actions/publish-image@260565cbd8654f905bd99b5de428179f63480808 # main
        with:
          image: ${{ inputs.IMAGE_NAME }}:${{ steps.determine-tag.outputs.tag }}
          sbom_filename: ${{ github.event.repository.name }}-sbom-${{ steps.determine-tag.outputs.tag }}.spdx.json

      - name: Cleanup Local Image
        if: always()
        uses: denbi/portal-github-actions/cleanup-image@260565cbd8654f905bd99b5de428179f63480808 # main
        with:
          image: ${{ inputs.IMAGE_NAME }}:${{ steps.determine-tag.outputs.tag }}
