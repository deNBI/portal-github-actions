name: 'Publish Docker Image'
description: 'Generates an SBOM and pushes the Docker image to the registry.'
inputs:
  image:
    description: 'The full image tag to publish'
    required: true
  sbom_filename:
    description: 'Filename for the SBOM output'
    required: false
    default: 'sbom.spdx.json'

runs:
  using: "composite"
  steps:
    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      with:
        image: ${{ inputs.image }}
        format: spdx-json
        output-file: ${{ inputs.sbom_filename }}

    - name: Push image to Registry
      shell: bash
      run: |
        docker push "${{ inputs.image }}"
