exclude: "^(?:docs|migrations|scripts)/|.+\\.(?:dump)$"
default_stages: [ pre-commit ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.178.0'
    hooks:
      - id: semgrep
        args:
          [
            '--config', 'https://semgrep.dev/p/default',
            '--error', '--skip-unknown-extensions',
            # Self-referencing actions use @main (no digest pin) to avoid a
            # Renovate self-update PR loop; exclude that rule as a supply-chain
            # attack is not a risk for an internal repo we control.
            '--exclude-rule', 'yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag',
          ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
