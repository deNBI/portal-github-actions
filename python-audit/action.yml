name: 'Python Pip Audit'
description: 'Performs a security audit of Python dependencies using pip-audit.'
inputs:
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.14'
  requirements_files:
    description: 'Space-separated list of requirements files to audit'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Run pip-audit
      uses: pypa/gh-action-pip-audit@1220774d901786e6f52ae159f7b6bc8fea6d266 # v1.1.0
      with:
        inputs: ${{ inputs.requirements_files }}
